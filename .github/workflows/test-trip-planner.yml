name: Trip Planner Tests

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/test-trip-planner.yml'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'vitest.config.ts'
      - 'playwright.config.ts'

env:
  NODE_VERSION: '18'
  VITE_SUPABASE_URL: https://test.supabase.co
  VITE_SUPABASE_ANON_KEY: test_anon_key
  VITE_MAPBOX_ACCESS_TOKEN: test_mapbox_token

jobs:
  # Unit and Integration Tests
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: ./coverage/coverage-final.json
          flags: unit
          name: unit-tests

  # E2E Tests - Chrome
  e2e-chrome:
    name: E2E Tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run E2E tests (Chrome)
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-chrome
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # E2E Tests - Firefox
  e2e-firefox:
    name: E2E Tests (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install firefox

      - name: Run E2E tests (Firefox)
        run: npx playwright test --project=firefox
        env:
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-firefox
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # E2E Tests - WebKit (Safari)
  e2e-webkit:
    name: E2E Tests (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install webkit

      - name: Run E2E tests (WebKit)
        run: npx playwright test --project=webkit
        env:
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-webkit
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Performance Tests
  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance benchmarks
        run: npx vitest run src/__tests__/performance/ --reporter=verbose
        env:
          CI: true
          NODE_OPTIONS: --expose-gc

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: test-results/performance/
          retention-days: 30

  # Mobile E2E Tests
  e2e-mobile:
    name: E2E Tests (Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run mobile E2E tests
        run: npx playwright test --project="Mobile Chrome" --project="Mobile Safari"
        env:
          CI: true

      - name: Upload mobile test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-mobile
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Test Results Summary
  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-chrome, e2e-firefox, e2e-webkit, e2e-mobile, performance-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate test summary
        run: |
          echo "# 🧪 Trip Planner Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Unit tests status
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "✅ **Unit & Integration Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit & Integration Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # E2E tests status
          if [ "${{ needs.e2e-chrome.result }}" == "success" ]; then
            echo "✅ **E2E Tests (Chrome)**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **E2E Tests (Chrome)**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.e2e-firefox.result }}" == "success" ]; then
            echo "✅ **E2E Tests (Firefox)**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **E2E Tests (Firefox)**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.e2e-webkit.result }}" == "success" ]; then
            echo "✅ **E2E Tests (WebKit)**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **E2E Tests (WebKit)**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.e2e-mobile.result }}" == "success" ]; then
            echo "✅ **Mobile E2E Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Mobile E2E Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Performance tests status
          if [ "${{ needs.performance-tests.result }}" == "success" ]; then
            echo "✅ **Performance Benchmarks**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Performance Benchmarks**: Failed or Degraded" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Test Coverage & Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Test artifacts are available for download for 7-30 days" >> $GITHUB_STEP_SUMMARY
          echo "- Performance results are stored for 30 days for trend analysis" >> $GITHUB_STEP_SUMMARY

      - name: Check overall test status
        run: |
          if [[ "${{ needs.unit-tests.result }}" == "failure" || 
                "${{ needs.e2e-chrome.result }}" == "failure" || 
                "${{ needs.e2e-firefox.result }}" == "failure" || 
                "${{ needs.e2e-webkit.result }}" == "failure" || 
                "${{ needs.e2e-mobile.result }}" == "failure" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi

  # Notify on test failures (optional)
  notify-failure:
    name: Notify Test Failures
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Notify team of test failures
        run: |
          echo "🚨 Trip planner tests failed on main branch"
          echo "Please check the test results and fix failing tests"
          # Add notification logic here (Slack, email, etc.)

  # Cleanup old test artifacts
  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            // Delete artifacts older than 30 days
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            
            for (const artifact of artifacts.data.artifacts) {
              if (new Date(artifact.created_at) < thirtyDaysAgo) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                console.log(`Deleted artifact: ${artifact.name}`);
              }
            }