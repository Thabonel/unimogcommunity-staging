name: Cross-Platform Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  VITE_SUPABASE_URL: https://test.supabase.co
  VITE_SUPABASE_ANON_KEY: test_anon_key
  VITE_MAPBOX_ACCESS_TOKEN: test_mapbox_token

jobs:
  # Test matrix across different OS and Node versions
  cross-platform-unit:
    name: Unit Tests - ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['16', '18', '20']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results-${{ matrix.os }}-node${{ matrix.node-version }}
          path: test-results/
          retention-days: 7

  # Cross-browser E2E tests
  cross-browser-e2e:
    name: E2E Tests - ${{ matrix.browser }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]
        exclude:
          # WebKit is not available on Windows
          - os: windows-latest
            browser: webkit
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.browser }}-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # Performance comparison across platforms
  performance-comparison:
    name: Performance Benchmarks - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance benchmarks
        run: npx vitest run src/__tests__/performance/ --reporter=json --reporter=verbose
        env:
          CI: true
          NODE_OPTIONS: --expose-gc

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.os }}
          path: |
            test-results/
            performance-results.json
          retention-days: 30

  # Docker-based testing
  docker-tests:
    name: Docker Environment Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test Docker image
        run: |
          cat > Dockerfile.test << EOF
          FROM node:18-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --only=production
          COPY . .
          RUN npm run build
          EXPOSE 3000
          CMD ["npm", "run", "preview"]
          EOF
          
          docker build -f Dockerfile.test -t trip-planner-test .

      - name: Run container tests
        run: |
          # Start the application container
          docker run -d --name app -p 3000:3000 \
            -e VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }} \
            -e VITE_SUPABASE_ANON_KEY=<SUPABASE_ANON_KEY> env.VITE_SUPABASE_ANON_KEY }} \
            -e VITE_MAPBOX_ACCESS_TOKEN=${{ env.VITE_MAPBOX_ACCESS_TOKEN }} \
            trip-planner-test
          
          # Wait for app to start
          sleep 10
          
          # Basic health check
          curl -f http://localhost:3000 || exit 1
          
          echo "✅ Docker container tests passed"

      - name: Cleanup Docker
        if: always()
        run: |
          docker stop app || true
          docker rm app || true
          docker rmi trip-planner-test || true

  # Accessibility testing
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright and axe
        run: |
          npx playwright install chromium
          npm install --save-dev @axe-core/playwright

      - name: Run accessibility tests
        run: |
          cat > tests/accessibility.spec.ts << EOF
          import { test, expect } from '@playwright/test';
          import { injectAxe, checkA11y } from 'axe-playwright';

          test('Trip planner should be accessible', async ({ page }) => {
            await page.goto('/trips');
            await injectAxe(page);
            
            // Check accessibility of main page
            await checkA11y(page, null, {
              detailedReport: true,
              detailedReportOptions: { html: true }
            });
            
            // Test with high contrast mode
            await page.emulateMedia({ media: 'screen', colorScheme: 'dark' });
            await checkA11y(page);
            
            // Test keyboard navigation
            await page.keyboard.press('Tab');
            await page.keyboard.press('Tab');
            await page.keyboard.press('Enter');
            
            await checkA11y(page);
          });
          EOF
          
          npx playwright test tests/accessibility.spec.ts
        env:
          CI: true

      - name: Upload accessibility results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: |
            test-results/
            accessibility-report/
          retention-days: 14

  # Security testing
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns
          if grep -r "sk-[a-zA-Z0-9]" src/ --include="*.ts" --include="*.tsx" --include="*.js"; then
            echo "❌ Found potential API keys"
            exit 1
          fi
          
          if grep -r "eyJ[a-zA-Z0-9]" src/ --include="*.ts" --include="*.tsx" --include="*.js"; then
            echo "❌ Found potential JWT tokens"
            exit 1
          fi
          
          echo "✅ No hardcoded secrets found"

      - name: Build security test
        run: npm run build
        env:
          CI: true

  # Test result aggregation
  aggregate-results:
    name: Aggregate Cross-Platform Results
    runs-on: ubuntu-latest
    needs: [cross-platform-unit, cross-browser-e2e, performance-comparison, docker-tests, accessibility-tests, security-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-test-results

      - name: Generate comprehensive report
        run: |
          echo "# 🌍 Cross-Platform Test Results" > report.md
          echo "" >> report.md
          echo "## Summary" >> report.md
          echo "" >> report.md
          
          # Unit tests summary
          echo "### Unit Tests" >> report.md
          if [[ "${{ needs.cross-platform-unit.result }}" == "success" ]]; then
            echo "✅ **All platforms passed**" >> report.md
          else
            echo "❌ **Some platforms failed**" >> report.md
          fi
          echo "" >> report.md
          
          # E2E tests summary
          echo "### E2E Tests" >> report.md
          if [[ "${{ needs.cross-browser-e2e.result }}" == "success" ]]; then
            echo "✅ **All browsers/platforms passed**" >> report.md
          else
            echo "❌ **Some browsers/platforms failed**" >> report.md
          fi
          echo "" >> report.md
          
          # Performance summary
          echo "### Performance" >> report.md
          if [[ "${{ needs.performance-comparison.result }}" == "success" ]]; then
            echo "✅ **Performance within acceptable ranges**" >> report.md
          else
            echo "⚠️ **Performance issues detected**" >> report.md
          fi
          echo "" >> report.md
          
          # Docker tests
          echo "### Docker Environment" >> report.md
          if [[ "${{ needs.docker-tests.result }}" == "success" ]]; then
            echo "✅ **Container tests passed**" >> report.md
          else
            echo "❌ **Container tests failed**" >> report.md
          fi
          echo "" >> report.md
          
          # Accessibility
          echo "### Accessibility" >> report.md
          if [[ "${{ needs.accessibility-tests.result }}" == "success" ]]; then
            echo "✅ **WCAG compliance verified**" >> report.md
          else
            echo "❌ **Accessibility issues found**" >> report.md
          fi
          echo "" >> report.md
          
          # Security
          echo "### Security" >> report.md
          if [[ "${{ needs.security-tests.result }}" == "success" ]]; then
            echo "✅ **No security issues detected**" >> report.md
          else
            echo "❌ **Security vulnerabilities found**" >> report.md
          fi
          echo "" >> report.md
          
          echo "---" >> report.md
          echo "*Report generated on $(date)*" >> report.md
          
          # Output to step summary
          cat report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload comprehensive report
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-report
          path: |
            report.md
            all-test-results/
          retention-days: 30